name: Gerar app Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - name: Gerar APK
        run: >
          flutter build apk --release
          --dart-define=AUDD_TOKEN=${{ secrets.AUDD_TOKEN }}
          --dart-define=JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: Sintonia-android
          path: build/app/outputs/flutter-apk/app-release.apk
